<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Spark</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#281f3b;color:#17111f;font-family:Inter,"PingFang SC",system-ui,sans-serif;display:grid;place-items:center}.desk{width:min(1050px,calc(100% - 32px));margin:30px auto;padding:clamp(24px,5vw,55px);border-radius:28px;background:#efe9ff;box-shadow:12px 14px 0 #ff9b7b}.eyebrow{font:700 12px monospace;letter-spacing:.1em}.desk h1{margin:12px 0 10px;font-size:clamp(48px,8vw,84px);line-height:.9;letter-spacing:-.055em}.intro{max-width:580px;color:#5e536e;line-height:1.5}.maker{margin-top:34px;display:grid;grid-template-columns:.72fr 1.28fr;gap:24px}.choices{display:grid;gap:14px}.group{padding:17px;border:1.5px solid;border-radius:14px;background:#fff}.group label{display:block;margin-bottom:10px;font:700 11px monospace}.group select{width:100%;min-height:44px;padding:0 10px;border:1px solid;border-radius:8px;background:#fff;font:inherit}.story{min-height:330px;padding:34px;border:2px solid;border-radius:18px;background:#fffef9;position:relative;overflow:hidden}.story:after{content:"✦";position:absolute;right:18px;bottom:4px;color:#d8c9ff;font-size:100px;z-index:0}.story h2{margin:0 0 20px;font-size:30px}.story p{position:relative;z-index:1;font:500 clamp(19px,2.6vw,27px)/1.55 Georgia,serif}.generate{min-height:52px;border:0;border-radius:10px;background:#17111f;color:white;font-weight:750;font-size:16px;cursor:pointer;box-shadow:5px 5px 0 #ff9b7b}.generate:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #ff9b7b}@media(max-width:720px){.maker{grid-template-columns:1fr}.story{min-height:270px}.desk{box-shadow:7px 8px 0 #ff9b7b}}
</style></head><body><main class="desk"><span class="eyebrow">CREATIVE WRITING COMPANION</span><h1>Story Spark</h1><p class="intro">Mix three ingredients, then open a door into a new story. Every spark is a beginning — you decide what happens next.</p><div class="maker"><section class="choices"><div class="group"><label>SETTING</label><select id="setting"><option>a library under the sea</option><option>a train that never stops</option><option>the last garden on Mars</option></select></div><div class="group"><label>MOOD</label><select id="mood"><option>mysterious</option><option>hopeful</option><option>playfully chaotic</option></select></div><div class="group"><label>UNEXPECTED OBJECT</label><select id="object"><option>a singing compass</option><option>a key made of ice</option><option>a postcard from tomorrow</option></select></div><button class="generate" id="generate">Generate a spark ✦</button></section><article class="story" aria-live="polite"><h2>Your story begins…</h2><p id="copy"></p></article></div></main><script>
const openings=[(s,m,o)=>`At ${s}, Kai found ${o} waiting on a table that had not been there the night before. The air felt ${m}. Then the object whispered Kai’s name.`,(s,m,o)=>`Everyone had forgotten the path to ${s}—everyone except a small robot carrying ${o}. On a ${m} morning, it asked Noor to follow.`,(s,m,o)=>`The rules at ${s} were simple: never run, never look behind you, and never touch ${o}. It was going well until the lights turned ${m}.`];let turn=0;function make(){const s=document.getElementById("setting").value,m=document.getElementById("mood").value,o=document.getElementById("object").value;document.getElementById("copy").textContent=openings[turn++%openings.length](s,m,o)}document.getElementById("generate").addEventListener("click",make);make();
</script></body></html>
