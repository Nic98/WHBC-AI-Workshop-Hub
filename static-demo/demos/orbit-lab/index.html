<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Lab</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b16;color:#f7f5ed;font-family:Inter,"PingFang SC",system-ui,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.panel{position:fixed;z-index:2;left:28px;top:28px;width:min(360px,calc(100% - 56px));padding:24px;border:1px solid #49506a;border-radius:20px;background:rgba(13,18,35,.86);backdrop-filter:blur(15px)}.eyebrow{color:#ddf27a;font:700 11px monospace;letter-spacing:.1em}.panel h1{margin:10px 0 8px;font-size:48px;line-height:.9;letter-spacing:-.05em}.panel p{margin:0 0 22px;color:#abb2c8;line-height:1.45}.control{margin-top:16px}.control label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.control input{width:100%;margin-top:10px;accent-color:#ddf27a}.actions{margin-top:22px;display:flex;gap:9px}.actions button{padding:10px 13px;border:1px solid #69718d;border-radius:8px;background:transparent;color:#fff;font-weight:700;cursor:pointer}.actions button:first-child{background:#ddf27a;color:#111;border-color:#ddf27a}.hint{position:fixed;right:24px;bottom:22px;color:#8990a6;font:600 11px monospace}@media(max-width:600px){.panel{left:16px;top:16px;width:calc(100% - 32px);padding:19px}.panel h1{font-size:40px}.hint{display:none}}
</style></head><body><canvas id="space"></canvas><section class="panel"><span class="eyebrow">INTERACTIVE PHYSICS SANDBOX</span><h1>Orbit Lab</h1><p>Adjust velocity and gravity, then watch the satellite draw its path.</p><div class="control"><label>VELOCITY <output id="speed-out">7.0</output></label><input id="speed" type="range" min="3" max="11" value="7" step="0.1"></div><div class="control"><label>GRAVITY <output id="gravity-out">6.0</output></label><input id="gravity" type="range" min="2" max="10" value="6" step="0.1"></div><div class="actions"><button id="launch">Launch</button><button id="reset">Clear trail</button></div></section><span class="hint">SPACE TO RELAUNCH · R TO CLEAR</span><script>
const canvas=document.getElementById("space"),ctx=canvas.getContext("2d"),speed=document.getElementById("speed"),gravity=document.getElementById("gravity");let w,h,dpr,sat,trail=[];function size(){dpr=Math.min(devicePixelRatio,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);launch()}function launch(){const r=Math.min(w,h)*.24;sat={x:w/2+r,y:h/2,vx:0,vy:-Number(speed.value)*.42};trail=[]}function draw(){ctx.fillStyle="rgba(8,11,22,.16)";ctx.fillRect(0,0,w,h);const cx=w/2,cy=h/2,dx=cx-sat.x,dy=cy-sat.y,dist=Math.max(30,Math.hypot(dx,dy)),force=Number(gravity.value)*70/(dist*dist);sat.vx+=dx/dist*force;sat.vy+=dy/dist*force;sat.x+=sat.vx;sat.y+=sat.vy;trail.push([sat.x,sat.y]);if(trail.length>900)trail.shift();ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle="#b8dcff";ctx.lineWidth=1.2;ctx.stroke();const glow=ctx.createRadialGradient(cx,cy,8,cx,cy,72);glow.addColorStop(0,"#ddf27a");glow.addColorStop(1,"rgba(221,242,122,0)");ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,72,0,7);ctx.fill();ctx.fillStyle="#ddf27a";ctx.beginPath();ctx.arc(cx,cy,24,0,7);ctx.fill();ctx.fillStyle="#ff9b7b";ctx.beginPath();ctx.arc(sat.x,sat.y,7,0,7);ctx.fill();if(dist<22||sat.x<-100||sat.x>w+100||sat.y<-100||sat.y>h+100)launch();requestAnimationFrame(draw)}[speed,gravity].forEach(el=>el.addEventListener("input",()=>document.getElementById(el.id+"-out").value=Number(el.value).toFixed(1)));document.getElementById("launch").onclick=launch;document.getElementById("reset").onclick=()=>trail=[];addEventListener("resize",size);addEventListener("keydown",e=>{if(e.code==="Space")launch();if(e.key.toLowerCase()==="r")trail=[]});size();draw();
</script></body></html>
