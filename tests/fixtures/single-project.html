<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Lab</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17121f; color: #fff; font-family: system-ui, sans-serif; }
      main { text-align: center; }
      .orb { width: 120px; aspect-ratio: 1; margin: 24px auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c8b6ff 20%, #6848ff 58%, #17121f 60%); animation: float 2.5s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-14px) rotate(8deg); } }
    </style>
  </head>
  <body><main><p>STUDENT AI EXPERIMENT</p><div class="orb"></div><h1>Orbit Lab</h1></main></body>
</html>
